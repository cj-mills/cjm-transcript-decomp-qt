[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-transcript-decomp-qt"
version = "0.0.4"
description = "Qt shell for the decomp-batch setup app — the second workflow TUI migrated to the PySide6 lane (DEC c4b0d6e5): the same batch queueing over transcription-run manifests, decomp-results drill with interleaved gap rows, VAD/FA probe views, and headless hand-off as cjm-transcript-decomp-tui, whose pure spine modules and CLI ladder it imports; the read-only graph seat and probe/propose jobs run under a Qt event loop via a private asyncio loop thread (DecompSession). Born on-graph."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['cjm-transcript-decomp-core>=0.0.8', 'cjm-substrate>=0.0.61', 'cjm-substrate-tui-kit>=0.0.2', 'cjm-substrate-qt-kit>=0.0.3', 'PySide6']

[project.scripts]
cjm-transcript-decomp-qt = "cjm_transcript_decomp_qt.cli:main"

[project.urls]
Repository = "https://github.com/cj-mills/cjm-transcript-decomp-qt"

[tool.setuptools.packages.find]
include = ["cjm_transcript_decomp_qt*"]
